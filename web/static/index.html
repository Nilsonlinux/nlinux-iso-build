<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instalador NLinux</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/logo.png">
</head>
<body>
<div id="app" class="dark">

  <!-- SPLASH -->
  <section id="splash" class="screen active">
    <div class="splash-center">
      <div class="logo-ring">
        <span class="pulse"></span>
        <span class="pulse delay-1"></span>
        <span class="pulse delay-2"></span>
        <div class="logo-circle">
          <img src="/static/logo.png" alt="NLinux">
        </div>
      </div>
      <h1 class="splash-title">NLinux</h1>
      <p class="splash-sub">Instalando sua distro</p>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
  </section>

  <!-- ASSISTENTE -->
  <section id="wizard" class="screen">
    <div class="wizard-shell">
      <header class="stepper">
        <div id="stepper-bar" class="stepper-bar"><span id="stepper-fill"></span></div>
        <span id="stepper-label" class="stepper-label">Bem-vindo</span>
      </header>
      <div id="step" class="step"></div>
      <div id="step-msg" class="step-msg" hidden>Selecione uma opção ou preencha os campos para continuar.</div>
      <footer class="nav">
        <button id="btn-back" class="btn ghost">Voltar</button>
        <button id="btn-next" class="btn primary">Continuar</button>
      </footer>
    </div>
  </section>

  <!-- INSTALANDO -->
  <section id="installing" class="screen">
    <div class="install-shell">
      <h2 class="install-title">Instalando NLinux</h2>
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 200 200">
          <defs>
            <linearGradient id="ring-gradient" gradientUnits="userSpaceOnUse" x1="12" y1="100" x2="188" y2="100">
              <stop offset="0" stop-color="#0d5ad6"/>
              <stop offset=".42" stop-color="#17a2d3"/>
              <stop offset=".5" stop-color="#b7f2ff"/>
              <stop offset=".58" stop-color="#17a2d3"/>
              <stop offset="1" stop-color="#0d5ad6"/>
              <animateTransform attributeName="gradientTransform" type="rotate" from="0 100 100" to="360 100 100" dur="3s" repeatCount="indefinite"/>
            </linearGradient>
          </defs>
          <circle class="ring-bg" cx="100" cy="100" r="88"/>
          <circle id="ring-fg" class="ring-fg" cx="100" cy="100" r="88"/>
        </svg>
        <div class="ring-center">
          <span id="ring-pct">0%</span>
        </div>
      </div>
      <p id="stage-label" class="stage-label shimmer">Iniciando…</p>
      <div id="stage-check" class="stages"></div>
      <p id="live-tail" class="live-tail"></p>
      <details class="logs">
        <summary>Registro da instalação</summary>
        <pre id="log-box" class="log-box"></pre>
      </details>
    </div>
  </section>

  <!-- RESULTADO -->
  <section id="done" class="screen">
    <div class="done-shell">
      <div class="logo-circle big">
        <img id="done-img" src="/static/logo.png" alt="NLinux">
      </div>
      <h2 id="done-title" class="done-title">Instalação concluída!</h2>
      <p id="done-msg" class="done-msg">Remova o pendrive e reinicie a máquina.</p>
      <div class="done-actions">
        <button id="btn-reboot" class="btn primary">Reiniciar</button>
        <button id="btn-done" class="btn ghost">Fechar</button>
      </div>
    </div>
  </section>

</div>

<!-- MODAL DE CONFIRMAÇÃO -->
<div id="modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <div class="modal-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 2v6h-6"/>
        <path d="M3 12a9 9 0 0 1 15.36-6.36L21 8"/>
        <path d="M3 22v-6h6"/>
        <path d="M21 12a9 9 0 0 1-15.36 6.36L3 16"/>
      </svg>
    </div>
    <div class="spinner" hidden></div>
    <h3 id="modal-title"></h3>
    <p id="modal-msg"></p>
    <div class="modal-actions">
      <button id="modal-cancel" class="btn ghost"></button>
      <button id="modal-ok" class="btn primary"></button>
    </div>
  </div>
</div>

<!-- AJUSTE DE TAMANHO PARA DUAL BOOT -->
<div id="resize-modal" class="modal-overlay" role="dialog" aria-modal="true"
     aria-labelledby="resize-title" hidden>
  <div class="modal resize-modal">
    <h3 id="resize-title"></h3>
    <p id="resize-help"></p>
    <label class="resize-label" for="resize-partition"></label>
    <select id="resize-partition"></select>
    <label class="resize-label" for="resize-range"></label>
    <input id="resize-range" type="range" min="8" max="128" value="40" disabled>
    <p id="resize-detail" class="resize-detail" aria-live="polite"></p>
    <p id="resize-note" class="resize-note"></p>
    <div class="modal-actions">
      <button id="resize-cancel" class="btn ghost" type="button"></button>
      <button id="resize-save" class="btn primary" type="button" disabled></button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
