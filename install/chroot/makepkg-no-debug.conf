source /etc/makepkg.conf

_falconos_makepkg_options=()
for _falconos_makepkg_option in "${OPTIONS[@]}"; do
  case "$_falconos_makepkg_option" in
    debug|!debug) ;;
    *) _falconos_makepkg_options+=("$_falconos_makepkg_option") ;;
  esac
done
OPTIONS=("${_falconos_makepkg_options[@]}" "!debug")
unset _falconos_makepkg_options _falconos_makepkg_option
