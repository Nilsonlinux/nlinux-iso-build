# Sons de interface. Dois temas entram em cena:
#
#   - "nlinux" (em ~/.local/share/sounds/nlinux, via config/.local) troca só o
#     som de notificação pelo arquivo do NLinux. O resto vem por
#     `Inherits=freedesktop` no index.theme, e é por isso que o pacote
#     sound-theme-freedesktop continua obrigatório: ele fornece o bip de volume
#     (audio-volume-change), que é CC-BY-SA e não entra no repositório. O
#     Noctalia só resolve .oga/.ogg/.wav, nunca .mp3 -- o arquivo foi convertido
#     para ogg/vorbis a 48 kHz.
#   - os diretórios de busca, em ordem: ~/.local/share/sounds, $XDG_DATA_DIRS,
#     /usr/local/share/sounds e /usr/share/sounds. É por isso que o tema do
#     usuário vence o do sistema.
#
# As três chaves aqui são as que a máquina de produção do Nilson tem em
# ~/.local/state/noctalia/settings.toml. Não acrescentar enable_sounds achando que
# ela resolve o som duplo do print: não resolve. O default dela já é true
# (AudioConfig em config_types.h), e nenhum dos dois caminhos de som do print lê a
# chave — `SoundPlayer` não tem nem setEnabled, só setTheme e setVolume. Quem traz
# o segundo som é o toast de "captura salva", tratado no filtro mais abaixo.
#
# `sound_volume` é o float32 1.0 na forma decimal exata que o próprio Noctalia
# grava: é o mesmo número que a interface devolve, então não diverge do que o
# usuário vê depois de mexer no ajuste.
[audio]
enable_overdrive = true
sound_theme = "nlinux"
sound_volume = 0.99999997764825821

# ── Print: um som só ──────────────────────────────────────────────────────────
# O atalho de captura do Noctalia dispara DOIS eventos de som por construção, e
# nenhum ajuste de áudio desliga o segundo:
#   - `screen-capture`, o clique da câmera, tocado em playCaptureSound() antes de
#     congelar a tela (cai no freedesktop, já que o tema nlinux não traz esse
#     arquivo);
#   - `message-new-instant`, porque depois de gravar o arquivo o serviço de
#     captura posta addInternal("Noctalia", "Screenshot saved", <caminho>).
#
# O filtro abaixo corta o som desse toast e só ele. show_toast fica no padrão
# (true) de propósito: o clique já avisa que a captura saiu, e o toast continua
# dizendo onde o arquivo foi parar — some o som duplicado, não a informação.
#
# `match_content` casa o summary cru. A tradução do "Screenshot saved" é só na
# exibição; addInternal guarda o texto original, então a regex é em inglês de
# propósito. E `match = "noctalia"` sozinho não serviria: o serviço também posta
# "Screenshot failed", que é Critical e vale continuar soando — é o `^...$` que
# separa os dois.
[notification.filter.nlinux_captura_salva]
enabled       = true
match         = "noctalia"
match_content = "^Screenshot saved$"
play_sound    = false

[shell]
settings_window_translucent = true
polkit_agent = true

    [shell.animation]
    speed = 0.55000000819563866

    [shell.panel]
    transparency_mode = "glass"
    polkit_placement = "attached"
    
    [shell.screenshot]
    annotate = true

[control_center]
sidebar = "full"


[location]
auto_locate = true

[dock]
enabled = true

launcher_position = "start"
magnification_scale = 2.0
pinned = [
    "org.telegram.desktop",
    "whatsapp-linux-desktop",
    "firefox",
    "discord",
    "kitty",
    "org.gnome.Nautilus",
    "spotify-launcher",
    "nlinuxstore",
]
reserve_space = false
show_dots = true
smart_auto_hide = true

# Layout da barra superior. Vem da configuração que o Nilson usa na máquina de
# produção, para a ISO já nascer com a barra no formato dele. Os grupos em
# cápsula separam os indicadores em dois blocos: g1 (ram, temp, cpu) na ponta
# esquerda, g2 (weather, clock) no centro. A indentação de 4 espaços nas
# entradas [[bar.default.capsule_group]] é a que o Noctalia grava ao exportar,
# e foi mantida para o diff com a máquina de produção continuar limpo.
[widget.network]
show_label = false

[bar.default]
start = [ "launcher", "wallpaper", "workspaces", "group:g1" ]

background_opacity = 0.79999998211860657
capsule = true

center = [ "group:g2" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "ram", "cpu", "temp" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "weather", "clock" ]
    opacity = 1.0
    padding = 6.0


[widget.clock]
format = "{:%H:%M:%S}"

[widget.cpu]
visualization = "none"

[widget.ram]
visualization = "none"

[widget.temp]
visualization = "none"

[widget.media]
hide_when_no_media = true
rotate_album_art = true
show_progress = true
title_scroll = "always"
max_length = 165

[widget.weather]
show_condition = false

[theme.templates]
builtin_ids = [ "gtk3", "gtk4", "kitty", "starship" ]
