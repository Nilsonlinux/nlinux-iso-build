[shell]
polkit_agent = true

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
enabled = true
fill = "surface_variant"
id = "g5"
members = [ "cpu", "temp", "ram" ]
opacity = 1.0
padding = 6.0

[location]
auto_locate = true

[dock]
enabled = true

launcher_position = "start"
magnification_scale = 2.0
pinned = [
    "org.telegram.desktop",
    "whatsapp-linux-desktop",
    "firefox",
    "discord",
    "kitty",
    "org.gnome.Nautilus",
    "spotify-launcher",
    "nlinuxstore",
]
reserve_space = false
show_dots = true
smart_auto_hide = true

[theme.templates]
builtin_ids = [ "gtk3", "gtk4", "kitty", "starship", "umbriel" ]
