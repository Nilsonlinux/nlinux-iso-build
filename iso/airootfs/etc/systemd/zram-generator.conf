# Swap em RAM comprimida (zram) para o live.
#
# O instalador é pesado: Firefox em modo kiosk + rsync/pacstrap/mkinitcpio
# no mesmo sistema. Sem swap, o OOM killer mata processos durante a instalação
# (inclusive a janela do Firefox, que fecha no meio da cópia).
#
# Metade da RAM, no máximo 4 GiB, com zstd. Requer zram-generator
# (já em iso/packages.live).
[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
