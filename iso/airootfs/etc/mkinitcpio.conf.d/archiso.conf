# Reduz o uso de RAM no live: sem o hook "memdisk", a raiz do sistema não é
# copiada para a RAM no boot (monta direto do pendrive/mídia). Para voltar ao
# comportamento padrão do archiso (copiar tudo para a RAM), remova este arquivo.
HOOKS=(base udev microcode modconf kms archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)